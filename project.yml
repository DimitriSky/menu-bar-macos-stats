name: MenuBarStats
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: MenuBar Stats
    INFOPLIST_KEY_NSHumanReadableCopyright: '© 2026 MenuBar Stats'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  MenuBarStats:
    type: application
    platform: macOS
    sources: [Sources, Assets.xcassets]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.MenuBarStats
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: IOKit.framework
